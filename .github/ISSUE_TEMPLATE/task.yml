name: Task
description: One task for one team, with the proof required to close it.
title: "[team] short task name"
labels: ["task"]
body:
  - type: dropdown
    id: team
    attributes:
      label: Team
      options:
        - Live session
        - Feedback
        - Identity & profile
        - Lead
    validations:
      required: true

  - type: input
    id: requirements
    attributes:
      label: Requirement IDs
      placeholder: "FR-12, NFR-04 — or none"
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One or two sentences. What exists when this is done that doesn't exist now.
    validations:
      required: true

  - type: textarea
    id: start-here
    attributes:
      label: Start here
      description: >-
        Written by whoever creates the task. The files and functions the builder opens first,
        in the order a request travels: screen → HTTP call → route → controller → service → table.
        Leave out the steps this task doesn't touch.
      value: |
        1. apps/web/src/pages/<Screen>.tsx → <function>() (the screen)
        2. apps/web/src/lib/api.ts → <function>() (the HTTP call)
        3. apps/api/src/routes/<name>.routes.ts → <METHOD /path> (the URL)
        4. apps/api/src/controllers/<name>.controller.ts → <function>() (checks the input)
        5. apps/api/src/services/<name>.service.ts → <function>() (the logic and database)
        6. apps/api/prisma/schema.prisma → model <Name> (the table)
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Written by whoever creates the task, not the builder. Each one becomes a test.
      value: |
        - [ ] Given …, when …, then …
        - [ ] Given …, when …, then …
    validations:
      required: true

  - type: checkboxes
    id: proof
    attributes:
      label: Proof required in the PR
      description: Tick what the builder must attach. Screenshots or a short screen recording, not pasted text.
      options:
        - label: Screenshot or recording of the feature working in the browser
        - label: Screenshot of the error or empty state (what the user sees when it fails)
        - label: Screenshot of the browser Network tab showing the request and response
        - label: Screenshot of the terminal running `bun run typecheck` and `bun run test` (until CI runs them)
        - label: Screenshot of the database rows it creates or changes

  - type: textarea
    id: depends
    attributes:
      label: Depends on / unblocked by
      description: Issue numbers, or the STUB to build against until they land.
      placeholder: "#<issue> — or the STUB to build against until it lands"

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What not to touch, so the PR stays small.
