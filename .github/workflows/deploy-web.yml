name: Deploy web

# Builds apps/web and publishes it to Firebase Hosting: the live site on every push to main,
# and a preview URL (commented on the PR) for every pull request from this repository.
# Does nothing until the FIREBASE_PROJECT_ID repository variable is set (docs/sprint-2.md).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deploy:
    if: >-
      vars.FIREBASE_PROJECT_ID != '' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      # VITE_ values are baked into the JavaScript at build time and are public by design.
      - name: Build web
        run: bun run --filter @interview/web build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          # "live" publishes the real site; empty means a temporary preview channel for the PR.
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
