name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway database for the migrations and the job-queue tests (FB2).
    # CI never sees the team's Supabase credentials.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interview_test

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Vitest and the Prisma CLI run on Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install (also runs prisma generate)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Apply migrations to the test database
        run: bun run --filter @interview/api db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Test
        run: bun run test

      - name: Build web
        run: bun run --filter @interview/web build

  # Builds the Cloud Run image and checks it starts. Catches Dockerfile, Prisma engine and
  # startup problems before they reach a deploy.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build the API image
        run: docker build -t interview-api .

      - name: Start it and check /health and the Prisma engine
        run: |
          docker run -d --name api -p 8080:8080 \
            -e PORT=8080 \
            -e SUPABASE_URL=https://placeholder.supabase.co \
            -e SUPABASE_SERVICE_ROLE_KEY=placeholder \
            -e DATABASE_URL=postgresql://user:pass@127.0.0.1:1/db \
            interview-api
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && break
            if [ "$i" = 30 ]; then docker logs api; exit 1; fi
            sleep 1
          done
          # The worker's first query must fail on the (fake) database, not on a missing or
          # wrong Prisma engine: "Can't reach database server" proves the engine loaded.
          for i in $(seq 1 30); do
            docker logs api 2>&1 | grep -q "Can't reach database server" && exit 0
            sleep 1
          done
          docker logs api
          exit 1

  # The golden path in a real browser (P-14): sign in, upload a resume, a typed interview with
  # two answers, end it, read the feedback. Runs against this job's own Postgres, with Gemini
  # replaced by apps/web/e2e/fake-gemini.ts. Sign-in uses the real Supabase project with a
  # dedicated test account (E2E_EMAIL / E2E_PASSWORD secrets) and the public anon key.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interview_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interview_e2e
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install (also runs prisma generate)
        run: bun install --frozen-lockfile

      - name: Apply migrations to the e2e database
        run: bun run --filter @interview/api db:migrate

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run the golden path
        working-directory: apps/web
        run: npx playwright test

      - name: Keep the trace if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
