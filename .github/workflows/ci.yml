name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway database for the migrations and the job-queue tests (FB2).
    # CI never sees the team's Supabase credentials.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interview_test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Vitest and the Prisma CLI run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (also runs prisma generate)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Apply migrations to the test database
        run: bun run --filter @interview/api db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Test
        run: bun run test

      - name: Build web
        run: bun run --filter @interview/web build

  # Builds the Cloud Run image and checks it starts. Catches Dockerfile, Prisma engine and
  # startup problems before they reach a deploy.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -t interview-api .

      - name: Start it and check /health and the Prisma engine
        run: |
          docker run -d --name api -p 8080:8080 \
            -e PORT=8080 \
            -e SUPABASE_URL=https://placeholder.supabase.co \
            -e SUPABASE_SERVICE_ROLE_KEY=placeholder \
            -e DATABASE_URL=postgresql://user:pass@127.0.0.1:1/db \
            interview-api
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && break
            if [ "$i" = 30 ]; then docker logs api; exit 1; fi
            sleep 1
          done
          # The worker's first query must fail on the (fake) database, not on a missing or
          # wrong Prisma engine: "Can't reach database server" proves the engine loaded.
          for i in $(seq 1 30); do
            docker logs api 2>&1 | grep -q "Can't reach database server" && exit 0
            sleep 1
          done
          docker logs api
          exit 1
